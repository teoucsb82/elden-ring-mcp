name: weekly-data
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Restore previous db
        run: npm run fetch-data || echo "no previous release; full build"
      - run: npm run build
      - run: npm run attribution
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="data-$(date -u +%Y.%m.%d)"
          awk '/^## /{n++} n==1' data/CHANGELOG-data.md > /tmp/release-notes.md
          gh release create "$TAG" data/elden-ring.db --title "$TAG" --notes-file /tmp/release-notes.md
      - name: Open PR with changelog
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/weekly
          commit-message: 'data: weekly sync'
          title: 'data: weekly sync'
          body: 'Automated Fandom sync. Release: data-${{ github.run_id }}. See data/CHANGELOG-data.md.'
          add-paths: |
            data/CHANGELOG-data.md
            data/ATTRIBUTION.md
